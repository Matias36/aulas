<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNM Aulas · Ingresar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Arimo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="pantalla login">
  <img class="logo" src="img/logo.svg" alt="UNM Aulas">
  <h1 id="titulo">Bienvenido</h1>

  <form id="form-login" autocomplete="on" novalidate>
    <label class="campo"><input id="dni" type="text" inputmode="numeric" maxlength="8" placeholder="DNI." autocomplete="username"></label>
    <label class="campo">
      <input id="password" type="password" placeholder="Contraseña." autocomplete="current-password">
      <button id="ojo" class="ojo" type="button" aria-label="Mostrar contraseña">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5a4.5 4.5 0 110-9 4.5 4.5 0 010 9zm0-7a2.5 2.5 0 100 5 2.5 2.5 0 000-5z"/></svg>
      </button>
    </label>
    <button id="btn-olvido" class="olvido link" type="button">¿Olvidó su contraseña?</button>
    <p id="error" class="error" role="alert"></p>
    <button id="btn-acceder" class="btn-primario" type="submit">Acceder</button>
  </form>
  <button id="btn-crear" class="crear link" type="button">Crear cuenta</button>

  <div class="admin"><button id="btn-admin" type="button">Acceso administrador</button></div>
</main>
<script src="js/login.js"></script>
</body>
</html>
