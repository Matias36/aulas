<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNM Aulas · Crear cuenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Arimo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="pantalla registro">
  <header class="titulo-aula">
    <a href="index.html" aria-label="Volver al ingreso"><svg viewBox="0 0 24 24"><path d="M15 3L6 12l9 9"/></svg></a>
    <h1>Crear cuenta</h1>
  </header>
  <form id="form-registro" novalidate>
    <div class="grupo">
      <label class="etiqueta" for="dni">DNI</label>
      <div class="campo"><input id="dni" type="text" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="Sin puntos"></div>
      <p class="ayuda">Un DNI solo puede tener una cuenta.</p>
    </div>
    <div class="grupo"><label class="etiqueta" for="nombre">Nombre</label><div class="campo"><input id="nombre" type="text" autocomplete="given-name"></div></div>
    <div class="grupo"><label class="etiqueta" for="apellido">Apellido</label><div class="campo"><input id="apellido" type="text" autocomplete="family-name"></div></div>
    <div class="grupo">
      <label class="etiqueta" for="carrera">Carrera</label>
      <div class="campo"><select id="carrera"><option value="">Elegí tu carrera</option></select></div>
    </div>
    <div class="grupo"><label class="etiqueta" for="clave">Contraseña</label><div class="campo"><input id="clave" type="password" autocomplete="new-password"><button class="ojo" type="button" data-ojo="clave" aria-label="Mostrar contraseña"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5a4.5 4.5 0 110-9 4.5 4.5 0 010 9zm0-7a2.5 2.5 0 100 5 2.5 2.5 0 000-5z"/></svg></button></div><p class="ayuda">Mínimo 8 caracteres.</p></div>
    <div class="grupo"><label class="etiqueta" for="clave2">Repetir contraseña</label><div class="campo"><input id="clave2" type="password" autocomplete="new-password"><button class="ojo" type="button" data-ojo="clave2" aria-label="Mostrar contraseña"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5a4.5 4.5 0 110-9 4.5 4.5 0 010 9zm0-7a2.5 2.5 0 100 5 2.5 2.5 0 000-5z"/></svg></button></div></div>
    <p id="error" class="error" role="alert"></p>
    <button class="btn-primario" type="submit">Crear cuenta</button>
  </form>
</main>
<script src="js/registro.js"></script>
</body>
</html>
