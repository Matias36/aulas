        const keyMateriasNotificadas = 'materias-notificadas';

        function obtenerMateriasNotificadas() {
            try {
                const guardadas = JSON.parse(localStorage.getItem(keyMateriasNotificadas) || '[]');
                return Array.isArray(guardadas) ? guardadas : [];
            } catch {
                return [];
            }
        }

        function guardarMateriasNotificadas(materias) {
            localStorage.setItem(keyMateriasNotificadas, JSON.stringify(materias));
        }

        function normalizarMateria(materia) {
            return String(materia || '').trim().toLowerCase();
        }

        function actualizarCampanaHeader() {
            if (!campanaHeader) return;

            const materias = obtenerMateriasNotificadas();
            const badge = campanaHeader.querySelector('.campana-badge');

            campanaHeader.classList.toggle('activa', materias.length > 0);
            if (badge) badge.textContent = String(materias.length);
            campanaHeader.title = materias.length > 0
                ? `${materias.length} materia${materias.length === 1 ? '' : 's'} con notificación`
                : 'Sin notificaciones activas';
        }

        function materiaTieneNotificacion(materia) {
            const materias = obtenerMateriasNotificadas();
            return materias.some((item) => normalizarMateria(item) === normalizarMateria(materia));
        }

        function alternarNotificacionMateria(materia) {
            const materias = obtenerMateriasNotificadas();
            const clave = normalizarMateria(materia);
            const siguiente = materias.some((item) => normalizarMateria(item) === clave)
                ? materias.filter((item) => normalizarMateria(item) !== clave)
                : [...materias, materia.trim()];

            guardarMateriasNotificadas(siguiente);
            actualizarCampanaHeader();
        }

        function obtenerDiaActual() {
            const nombreDia = new Intl.DateTimeFormat('es-AR', {
                timeZone: zonaHoraria,
                weekday: 'long'
            }).format(new Date()).toLowerCase();

            const mapaDias = {
                'lunes': 'lunes',
                'martes': 'martes',
                'miércoles': 'miercoles',
                'jueves': 'jueves',
                'viernes': 'viernes',
                'sábado': 'sabado',
                'domingo': 'lunes'
            };

            return mapaDias[nombreDia] || 'lunes';
        }

        function obtenerClasesDeAula(numero) {
            const diaActual = obtenerDiaActual();
            return clasesPorAula[numero]?.[diaActual] || [];

        function aplicarFiltro(minutosActualesParam) {
            const minutos = typeof minutosActualesParam === 'number' ? minutosActualesParam : obtenerMinutosArgentina();
            for (const tarjeta of aulasGrid.querySelectorAll('.aula-card')) {

                const clases = obtenerClasesDeAula(numero);
                const claseActiva = clases.find((clase) => estadoDeClase(clase, minutos) === 'en-curso');
                const clasePronta = clases.find((clase) => estadoDeClase(clase, minutos) === 'pronta');
                const estado = claseActiva
                    ? 'en-curso'
                    : clasePronta ? 'pronta' : clases.length ? 'sin-actividad' : 'sin-clases';

                let visible = true;
                if (filtroActual === 'disponibles') {
                    visible = (estado === 'sin-actividad' || estado === 'sin-clases');
                } else if (filtroActual === 'empezadas') {
                    visible = (estado === 'en-curso');
                }

                tarjeta.hidden = !visible;
            }
        }

        // La función ahora recibe minutos totales y devuelve HH:MM.
        function formatearHora(minutosTotales) {
            const horas = Math.floor(minutosTotales / 60);
            const minutos = minutosTotales % 60;
            return `${String(horas).padStart(2, '0')}:${String(minutos).padStart(2, '0')}`;
        }

        function obtenerMinutosArgentina() {
            const partes = new Intl.DateTimeFormat('en-GB', {
                timeZone: zonaHoraria,
                hour: '2-digit',
                minute: '2-digit',
                hourCycle: 'h23'
            }).formatToParts(new Date());
            const hora = Number(partes.find((parte) => parte.type === 'hour').value);
            const minuto = Number(partes.find((parte) => parte.type === 'minute').value);
            return hora * 60 + minuto;
        }

        // La comparación usa minutos absolutos, por eso permite horarios con 30 o 45 minutos.
        function estadoDeClase(clase, minutosActuales) {
            const inicio = clase.inicio;
            const fin = clase.fin;

            if (minutosActuales >= inicio && minutosActuales < fin) {
                return 'en-curso';
            }
            if (minutosActuales >= inicio - 60 && minutosActuales < inicio) {
                return 'pronta';
            }
            return 'sin-actividad';
        }

        function actualizarRelojYTarjetas() {
            const ahora = new Date();
            const minutosActuales = obtenerMinutosArgentina();
            relojArgentina.dateTime = ahora.toISOString();
            relojArgentina.textContent = `${new Intl.DateTimeFormat('es-AR', {
                timeZone: zonaHoraria,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hourCycle: 'h23'
            }).format(ahora)} · Buenos Aires, Argentina`;

            for (const tarjeta of aulasGrid.querySelectorAll('.aula-card')) {
                const numero = tarjeta.dataset.aula;
                const clases = obtenerClasesDeAula(numero);
                const claseActiva = clases.find(
                    (clase) => estadoDeClase(clase, minutosActuales) === 'en-curso'
                );
                const clasePronta = clases.find(
                    (clase) => estadoDeClase(clase, minutosActuales) === 'pronta'
                );
                const claseVisible = claseActiva || clasePronta;
                const estado = claseActiva
                    ? 'en-curso'
                    : clasePronta ? 'pronta' : clases.length ? 'sin-actividad' : 'sin-clases';
                const indicador = tarjeta.querySelector('.ocupado');
                const materia = tarjeta.querySelector('.materia-aula');
                const horario = tarjeta.querySelector('.horario-aula');
                const etiquetaEstado = tarjeta.querySelector('.estado-aula');
                const carrera = tarjeta.querySelector('.carrera-aula');

                indicador.classList.toggle('aula-ocupada', estado === 'en-curso');
                indicador.classList.toggle('aula-pronta', estado === 'pronta');
                indicador.classList.toggle('aula-libre', estado === 'sin-actividad' || estado === 'sin-clases');
                materia.textContent = claseVisible ? claseVisible.materia : '';
                horario.textContent = claseVisible
                    ? `${formatearHora(claseVisible.inicio)} a ${formatearHora(claseVisible.fin)}`
                    : clases.length ? '' : 'Sin clases programadas';
                carrera.textContent = claseVisible ? claseVisible.carrera : '';
                etiquetaEstado.textContent = estado === 'en-curso'
                    ? 'En curso'
                    : estado === 'pronta' ? 'Empieza pronto' : estado === 'sin-actividad' ? 'Disponible' : '';
                etiquetaEstado.className = `estado-aula estado-${estado}`;
                tarjeta.setAttribute(
                    'aria-label',
                    estado === 'pronta'
                        ? `Aula ${numero}: empieza pronto, de ${formatearHora(clasePronta.inicio)} a ${formatearHora(clasePronta.fin)}`
                        : estado === 'en-curso'
                            ? `Aula ${numero}: en curso, de ${formatearHora(claseActiva.inicio)} a ${formatearHora(claseActiva.fin)}`
                            : `Ver horarios del aula ${numero}`
                );
            }

            if (aulaSeleccionada !== null && !vistaHorarios.hidden) {
                renderizarClases(aulaSeleccionada, minutosActuales);
            }
            // Reaplica el filtro cada vez que se actualizan las tarjetas.
            aplicarFiltro(minutosActuales);
        }

        function renderizarClases(numero, minutosActuales) {
            const clases = obtenerClasesDeAula(numero);
            pistaHorarios.replaceChildren();

            for (const clase of clases) {
                const bloque = document.createElement('article');
                const estado = estadoDeClase(clase, minutosActuales);
                const tieneNotificacion = materiaTieneNotificacion(clase.materia);
                // Esto calcula la fila y la altura del bloque usando horas, manteniendo la grilla legible.
                const iconoCampana = tieneNotificacion
                ? 'iconos/icono azul(8).svg'
                : 'iconos/icono blanco(9).svg'
                const inicioFila = Math.max(1, Math.floor((clase.inicio - 8 * 60) / 60) + 1);
                const duracionHoras = Math.max(1, Math.ceil((clase.fin - clase.inicio) / 60));

                bloque.className = `bloque-clase ${estado === 'en-curso' ? 'clase-en-curso' : estado === 'pronta' ? 'clase-pronta' : ''}`;
                bloque.dataset.materia = clase.materia;
                bloque.style.gridRow = `${inicioFila} / span ${duracionHoras}`;
                bloque.innerHTML = `
                    <button class="campana-notif ${tieneNotificacion ? 'activa' : ''}" type="button" aria-label="${tieneNotificacion ? 'Quitar notificación' : 'Activar notificación'} para ${clase.materia}" aria-pressed="${tieneNotificacion}">
                        <img src="${iconoCampana}" alt="">
                    </button>
                    <strong>${clase.materia}</strong>
                    <span>${formatearHora(clase.inicio)} a ${formatearHora(clase.fin)}</span>
                    <span>Profesor: ${clase.profesor}</span>
                    ${estado === 'pronta' ? '<span>Empieza pronto</span>' : ''}
                    <span class="carrera-clase">${clase.carrera}</span>
                `;

                const botonCampana = bloque.querySelector('.campana-notif');
                if (botonCampana) {
                    botonCampana.addEventListener('click', (event) => {
                        event.stopPropagation();
                        alternarNotificacionMateria(clase.materia);
                        renderizarClases(numero, obtenerMinutosArgentina());
                    });
                }

                pistaHorarios.appendChild(bloque);
            }

            if (clases.length === 0) {
                const mensaje = document.createElement('p');
                mensaje.className = 'sin-clases';
                mensaje.textContent = 'No hay clases programadas para esta aula.';
                pistaHorarios.appendChild(mensaje);
            }
        }

        function mostrarHorarios(numero) {
            // Guarda la vista y el aula en el historial para que Atrás del celular vuelva a aulas.
            history.pushState(
                Object.assign({}, history.state, { vista: 'horarios', aula: numero }),
                ''
            );
            renderizarVistaHorarios(numero);
        }

        function renderizarVistaHorarios(numero) {
            aulaSeleccionada = numero;
            tituloHorarios.textContent = `Aula ${numero}`;
            document.body.classList.remove('vista-aulas');
            document.body.classList.add('vista-horarios');
            document.getElementById('filtro-aulas').hidden = true;
            if (tituloPlanta) tituloPlanta.hidden = true;
            document.getElementById('reloj-argentina').hidden = true;
            headerImagen.hidden = true;
            vistaAulas.hidden = true;
            vistaHorarios.hidden = false;
            actualizarRelojYTarjetas();
        }

        document.querySelector('#volver-aulas').addEventListener('click', () => {
            // Usa el mismo historial que el botón Atrás físico o del navegador.
            if (history.state && history.state.vista === 'horarios') {
                history.back();
                return;
            }
            mostrarVistaAulas();
        });

        campanaHeader?.addEventListener('click', () => {
            const materias = obtenerMateriasNotificadas();
            if (!materias.length) {
                const primeraMateria = aulas
                    .map((numero) => obtenerClasesDeAula(numero))
                    .flat()
                    .map((clase) => clase.materia)
                    .find(Boolean);

                if (primeraMateria) {
                    alternarNotificacionMateria(primeraMateria);
                    if (aulaSeleccionada) {
                        renderizarClases(aulaSeleccionada, obtenerMinutosArgentina());
                    }
                }
                return;
            }

            guardarMateriasNotificadas([]);
            actualizarCampanaHeader();
            if (aulaSeleccionada) {
                renderizarClases(aulaSeleccionada, obtenerMinutosArgentina());
            }
        });

        // Al retroceder en el historial, restaura la vista que corresponda.
        window.addEventListener('popstate', (evento) => {
            const estado = evento.state;
            if (estado && estado.vista === 'horarios' && aulas.includes(estado.aula)) {
                renderizarVistaHorarios(estado.aula);
                return;
            }
            mostrarVistaAulas();
        });

        function mostrarVistaAulas() {
            aulaSeleccionada = null;
            document.body.classList.remove('vista-horarios');
            document.body.classList.add('vista-aulas');
            document.getElementById('filtro-aulas').hidden = false;
            if (tituloPlanta) tituloPlanta.hidden = false;
            headerImagen.hidden = false;
            vistaHorarios.hidden = true;
            vistaAulas.hidden = false;
        }

        document.body.classList.add('vista-aulas');
        actualizarCampanaHeader();
        actualizarRelojYTarjetas();
        setInterval(actualizarRelojYTarjetas, 15_000);
    </script>
</body>
