<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Aulas - Daract I</title>
    <!-- Tailwind CSS CDN para el estilizado responsive y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Tipografía Inter y fuente por defecto */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #1e293b;
        }

        /* Ocultar barra de desplazamiento manteniendo funcionalidad scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Animación suave para cambio de vistas */
        .fade-in {
            animation: fadeIn 0.25s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Efectos interactivos para tarjetas */
        .classroom-card {
            transition: all 0.2s ease;
        }
        .classroom-card:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body >

    <!-- Mockup de Smartphone / Contenedor Principal -->
    <div class="relative w-full max-w-[412px] h-[100vh] sm:h-[840px] bg-white sm:rounded-[40px] shadow-2xl overflow-hidden flex flex-col border-0 sm:border-[8px] border-slate-800">

        <!-- Barra de Estado del Móvil (Status Bar) -->
        <div class="bg-purple-950 text-white px-6 pt-3 pb-1 flex justify-between items-center text-xs font-semibold select-none z-20 shrink-0">
            <!-- Reloj con zona horaria de Argentina (America/Argentina/Buenos_Aires) -->
            <span id="argentina-clock" class="tracking-wider text-purple-100 font-bold text-sm">--:--:--</span>
            <div class="flex items-center space-x-2 text-xs">
                <span class="text-[10px] bg-purple-800 px-1.5 py-0.5 rounded text-purple-200">ART (UTC-3)</span>
                <i class="fa-solid fa-signal text-[10px]"></i>
                <i class="fa-solid fa-wifi text-[10px]"></i>
                <i class="fa-solid fa-battery-three-quarters text-sm"></i>
            </div>
        </div>

        <!-- VISTA 1: Lista de Aulas y Filtros -->
        <div id="view-classrooms" class="flex-1 flex flex-col overflow-hidden bg-slate-50 fade-in">
            <!-- Header con título y fondo -->
            <div class="relative bg-gradient-to-br from-purple-900 via-indigo-900 to-purple-800 text-white p-5 pb-8 shrink-0 shadow-md">
                <div class="flex items-center space-x-3 mb-2">
                    <button class="p-2 rounded-full hover:bg-white/10 text-white transition-colors" title="Menú">
                        <i class="fa-solid fa-chevron-left text-lg"></i>
                    </button>
                    <h1 class="text-2xl font-bold tracking-tight">Daract I</h1>
                </div>
                <p class="text-xs text-purple-200 ml-9 -mt-1 flex items-center gap-1.5">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    Estado en tiempo real (Buenos Aires)
                </p>
            </div>

            <!-- Contenedor blanco flotante con filtros y lista -->
            <div class="flex-1 bg-slate-50 -mt-4 rounded-t-3xl p-4 flex flex-col overflow-hidden shadow-inner">
                
                <!-- Barra de Filtros (Todas, Libres, Ocupadas) -->
                <div class="flex items-center justify-between gap-2 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200/80 mb-4 shrink-0">
                    <button onclick="setFilter('all')" id="btn-filter-all" class="flex-1 py-2 px-3 text-xs font-semibold rounded-xl transition-all text-blue-600 bg-blue-50 border border-blue-200 shadow-sm">
                        Todas
                    </button>
                    <button onclick="setFilter('free')" id="btn-filter-free" class="flex-1 py-2 px-3 text-xs font-semibold rounded-xl transition-all text-slate-600 hover:bg-slate-50 flex items-center justify-center gap-1.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Libres
                    </button>
                    <button onclick="setFilter('occupied')" id="btn-filter-occupied" class="flex-1 py-2 px-3 text-xs font-semibold rounded-xl transition-all text-slate-600 hover:bg-slate-50 flex items-center justify-center gap-1.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Ocupadas
                    </button>
                </div>

                <!-- Título del sector -->
                <div class="flex justify-between items-center px-1 mb-3 shrink-0">
                    <h2 class="text-lg font-bold text-blue-700">Planta baja</h2>
                    <span id="counter-badge" class="text-xs font-medium text-slate-500 bg-slate-200/60 px-2.5 py-1 rounded-full">
                        6 aulas
                    </span>
                </div>

                <!-- Grid de Tarjetas de Aulas (Scrollable) -->
                <div id="classrooms-grid" class="grid grid-cols-2 gap-3.5 overflow-y-auto no-scrollbar pb-24 pr-0.5">
                    <!-- Se renderiza dinámicamente desde JS -->
                </div>
            </div>
        </div>

        <!-- VISTA 2: Detalle y Horarios del Aula -->
        <div id="view-detail" class="flex-1 flex flex-col overflow-hidden bg-white hidden fade-in">
            <!-- Header Vista Detalle -->
            <div class="bg-white px-5 pt-4 pb-3 flex items-center border-b border-slate-100 shadow-sm shrink-0">
                <button onclick="showClassroomsView()" class="p-2 -ml-2 rounded-full hover:bg-slate-100 text-indigo-900 transition-colors">
                    <i class="fa-solid fa-chevron-left text-xl"></i>
                </button>
                <h1 id="detail-title" class="text-2xl font-bold text-indigo-950 ml-2">Daract I - 01</h1>
            </div>

            <!-- Contenido de la Agenda (08:00 a 20:00) -->
            <div class="flex-1 overflow-y-auto p-4 space-y-2 no-scrollbar pb-24 relative" id="schedule-timeline">
                <!-- Indicador de Hora Actual -->
                <div id="current-time-line" class="absolute left-0 right-0 z-10 flex items-center pointer-events-none transition-all duration-500" style="top: 0px; display: none;">
                    <div class="w-12 text-right pr-2">
                        <span class="bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded shadow">AHO</span>
                    </div>
                    <div class="flex-1 h-0.5 bg-rose-500 shadow-sm"></div>
                </div>

                <!-- Bloques de Horarios Renderizados en JS -->
            </div>
        </div>

        <!-- Barra de Navegación Inferior Fija (Bottom Navigation Bar) -->
        <div class="absolute bottom-0 left-0 right-0 bg-indigo-950 text-white py-3 px-6 flex justify-around items-center rounded-t-3xl shadow-2xl z-30 border-t border-indigo-900/50">
            <button onclick="showClassroomsView()" id="nav-home" class="flex flex-col items-center space-y-1 text-purple-300 hover:text-white transition-colors">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[11px] font-medium">Inicio</span>
            </button>
            <button onclick="alert('Sección Calendario general en desarrollo')" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-purple-300 transition-colors">
                <i class="fa-regular fa-calendar-days text-lg"></i>
                <span class="text-[11px] font-medium">Calendario</span>
            </button>
            <button onclick="alert('Sección Perfil de Usuario en desarrollo')" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-purple-300 transition-colors">
                <i class="fa-regular fa-user text-lg"></i>
                <span class="text-[11px] font-medium">Perfil</span>
            </button>
        </div>

    </div>

    <!-- Scripts de Lógica y Datos -->
    <script>
        // Zona horaria estándar configurada a Argentina (Buenos Aires, UTC-3)
        const ARGENTINA_TIMEZONE = 'America/Argentina/Buenos_Aires';

        // Estructura de Datos de las Aulas con sus Horarios Asignados
        const classroomsData = [
            {
                id: '01',
                name: '01',
                schedules: [
                    { start: '12:00', end: '15:00', title: 'Análisis Matemático II', professor: 'Bonucci Pablo', commission: 'COM 1', degree: 'Ingeniería Electrónica' },
                    { start: '17:00', end: '20:00', title: 'Derecho Laboral I', professor: 'Gradin Marcelo', commission: 'COM 5', degree: 'Lic. En Administración' }
                ]
            },
            {
                id: '02',
                name: '02',
                schedules: [
                    { start: '12:00', end: '15:00', title: 'Física I', professor: 'García Carlos', commission: 'COM 2', degree: 'Ingeniería Electrónica' },
                    { start: '18:00', end: '21:00', title: 'Álgebra Lineal', professor: 'Pérez María', commission: 'COM 3', degree: 'Lic. en Sistemas' }
                ]
            },
            {
                id: '03',
                name: '03',
                schedules: [
                    { start: '09:00', end: '12:00', title: 'Química General', professor: 'López Ana', commission: 'COM 1', degree: 'Ingeniería Química' },
                    { start: '15:00', end: '18:00', title: 'Programación I', professor: 'Martínez Luis', commission: 'COM 4', degree: 'Lic. en Sistemas' }
                ]
            },
            {
                id: '04',
                name: '04',
                schedules: [
                    { start: '14:00', end: '17:00', title: 'Estadística Aplicada', professor: 'Fernández Silvia', commission: 'COM 2', degree: 'Lic. En Administración' }
                ]
            },
            {
                id: '05',
                name: '05',
                schedules: [
                    { start: '08:00', end: '11:00', title: 'Sistemas Operativos', professor: 'Torres Roberto', commission: 'COM 1', degree: 'Lic. en Sistemas' },
                    { start: '18:00', end: '21:00', title: 'Economía I', professor: 'Sánchez Nora', commission: 'COM 2', degree: 'Lic. En Administración' }
                ]
            },
            {
                id: '06',
                name: '06',
                schedules: [
                    { start: '10:00', end: '13:00', title: 'Inglés Técnico I', professor: 'Díaz Patricia', commission: 'COM 1', degree: 'Todas las carreras' }
                ]
            }
        ];

        // Variables de estado global
        let currentFilter = 'all';
        let selectedClassroom = null;

        /**
         * Obtener objeto Date ajustado exactamente a la Hora Oficial de Argentina
         */
        function getArgentinaDate() {
            const now = new Date();
            const argTimeString = now.toLocaleString("en-US", { timeZone: ARGENTINA_TIMEZONE });
            return new Date(argTimeString);
        }

        /**
         * Actualizar el reloj de la barra superior cada segundo
         */
        function updateClock() {
            const argDate = getArgentinaDate();
            const hours = String(argDate.getHours()).padStart(2, '0');
            const minutes = String(argDate.getMinutes()).padStart(2, '0');
            const seconds = String(argDate.getSeconds()).padStart(2, '0');
            
            document.getElementById('argentina-clock').innerText = `${hours}:${minutes}:${seconds}`;

            // Re-evaluar el estado de las aulas cada segundo
            renderClassroomGrid();
            if (selectedClassroom) {
                updateTimeLineIndicator();
            }
        }

        /**
         * Determina si un aula está ocupada en el instante actual de Argentina
         * Devuelve { isOccupied: boolean, currentSchedule: object|null }
         */
        function getClassroomStatus(classroom) {
            const argDate = getArgentinaDate();
            const currentMinutes = argDate.getHours() * 60 + argDate.getMinutes();

            for (const sched of classroom.schedules) {
                const [startH, startM] = sched.start.split(':').map(Number);
                const [endH, endM] = sched.end.split(':').map(Number);
                
                const startMinutes = startH * 60 + startM;
                const endMinutes = endH * 60 + endM;

                if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
                    return { isOccupied: true, schedule: sched };
                }
            }
            return { isOccupied: false, schedule: null };
        }

        /**
         * Renderizar la lista de tarjetas de aulas según filtro activo y horarios vigentes
         */
        function renderClassroomGrid() {
            const gridContainer = document.getElementById('classrooms-grid');
            gridContainer.innerHTML = '';

            let visibleCount = 0;

            classroomsData.forEach(classroom => {
                const status = getClassroomStatus(classroom);

                // Filtrado dinámico
                if (currentFilter === 'free' && status.isOccupied) return;
                if (currentFilter === 'occupied' && !status.isOccupied) return;

                visibleCount++;

                // Encontrar el horario a mostrar en la tarjeta (o el actual u ocupado)
                let displayTime = 'Disponible';
                if (status.isOccupied) {
                    displayTime = `${status.schedule.start} - ${status.schedule.end}`;
                } else if (classroom.schedules.length > 0) {
                    // Muestra el próximo o primer intervalo
                    displayTime = `${classroom.schedules[0].start} - ${classroom.schedules[0].end}`;
                }

                // Crear tarjeta
                const card = document.createElement('div');
                card.className = `classroom-card bg-white p-4 rounded-2xl border-2 flex flex-col justify-between h-[130px] cursor-pointer shadow-sm hover:shadow-md ${
                    status.isOccupied ? 'border-blue-400/80 bg-gradient-to-b from-white to-rose-50/20' : 'border-blue-400/80 bg-gradient-to-b from-white to-emerald-50/20'
                }`;
                card.onclick = () => showDetailView(classroom);

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="text-3xl font-extrabold text-indigo-950">${classroom.name}</span>
                        <span class="relative flex h-3.5 w-3.5">
                            ${status.isOccupied ? `
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-rose-500"></span>
                            ` : `
                                <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500"></span>
                            `}
                        </span>
                    </div>
                    <div class="mt-auto">
                        <p class="text-[11px] font-medium text-slate-400">
                            ${status.isOccupied ? 'Ocupada hasta' : 'Horario asignado'}
                        </p>
                        <p class="text-xs font-semibold text-slate-700">
                            ${displayTime}
                        </p>
                    </div>
                `;

                gridContainer.appendChild(card);
            });

            document.getElementById('counter-badge').innerText = `${visibleCount} aulas`;
        }

        /**
         * Cambio de filtro activo
         */
        function setFilter(filter) {
            currentFilter = filter;

            // Reiniciar clases del botón activo
            const btnAll = document.getElementById('btn-filter-all');
            const btnFree = document.getElementById('btn-filter-free');
            const btnOccupied = document.getElementById('btn-filter-occupied');

            const inactiveClass = "flex-1 py-2 px-3 text-xs font-semibold rounded-xl transition-all text-slate-600 hover:bg-slate-50 border border-transparent";
            const activeClass = "flex-1 py-2 px-3 text-xs font-semibold rounded-xl transition-all shadow-sm border border-blue-200 bg-blue-50 text-blue-700";

            btnAll.className = filter === 'all' ? activeClass : inactiveClass;
            btnFree.className = filter === 'free' ? activeClass : inactiveClass;
            btnOccupied.className = filter === 'occupied' ? activeClass : inactiveClass;

            renderClassroomGrid();
        }

        /**
         * Cambiar a Vista Detalle
         */
        function showDetailView(classroom) {
            selectedClassroom = classroom;
            document.getElementById('view-classrooms').classList.add('hidden');
            document.getElementById('view-detail').classList.remove('hidden');
            document.getElementById('detail-title').innerText = `Daract I - ${classroom.name}`;

            renderTimeline(classroom);
        }

        /**
         * Volver a la Vista Principal
         */
        function showClassroomsView() {
            selectedClassroom = null;
            document.getElementById('view-detail').classList.add('hidden');
            document.getElementById('view-classrooms').classList.remove('hidden');
        }

        /**
         * Renderizar la línea de tiempo de la agenda (08:00 a 20:00)
         */
        function renderTimeline(classroom) {
            const timeline = document.getElementById('schedule-timeline');
            timeline.innerHTML = '';

            const hours = ['08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00'];

            hours.forEach(hour => {
                const hourNum = parseInt(hour.split(':')[0]);
                
                // Buscar si hay una clase que empiece en esta hora
                const matchClass = classroom.schedules.find(s => parseInt(s.start.split(':')[0]) === hourNum);

                if (matchClass) {
                    // Calcular duración en horas
                    const startH = parseInt(matchClass.start.split(':')[0]);
                    const endH = parseInt(matchClass.end.split(':')[0]);
                    const duration = endH - startH;

                    const classCard = document.createElement('div');
                    classCard.className = "flex items-start mb-2";
                    classCard.innerHTML = `
                        <div class="w-12 text-xs font-semibold text-slate-500 pt-1">${hour}</div>
                        <div class="flex-1 bg-amber-500 text-white p-3.5 rounded-2xl shadow-sm relative overflow-hidden my-0.5">
                            <div class="flex justify-between items-start mb-1">
                                <h3 class="font-bold text-sm tracking-tight text-white">${matchClass.title}</h3>
                                <i class="fa-regular fa-bell text-white/80 text-sm"></i>
                            </div>
                            <p class="text-xs text-amber-100 font-medium">${matchClass.professor} | ${matchClass.commission}</p>
                            <p class="text-xs font-bold text-amber-950 mt-3">${matchClass.degree}</p>
                        </div>
                    `;
                    timeline.appendChild(classCard);
                } else {
                    // Fila hora vacía libre
                    const emptyRow = document.createElement('div');
                    emptyRow.className = "flex items-center h-11 border-b border-slate-100";
                    emptyRow.innerHTML = `
                        <div class="w-12 text-xs font-semibold text-slate-400">${hour}</div>
                        <div class="flex-1 h-8 bg-slate-100/70 rounded-xl"></div>
                    `;
                    timeline.appendChild(emptyRow);
                }
            });

            updateTimeLineIndicator();
        }

        /**
         * Posicionar indicador visual de la hora actual en el detalle
         */
        function updateTimeLineIndicator() {
            const line = document.getElementById('current-time-line');
            if (!line || !selectedClassroom) return;

            const argDate = getArgentinaDate();
            const hours = argDate.getHours();
            const minutes = argDate.getMinutes();

            // Rango visible de 8:00 a 20:00
            if (hours >= 8 && hours <= 20) {
                line.style.display = 'flex';
                // Cálculo simple de desplazamiento vertical
                const relativeHour = (hours - 8) + (minutes / 60);
                const topPos = 16 + (relativeHour * 48); // 48px por bloque de hora
                line.style.top = `${topPos}px`;
            } else {
                line.style.display = 'none';
            }
        }

        // Inicialización al cargar la página
        window.onload = function() {
            // Iniciar ciclo de reloj en tiempo real
            updateClock();
            setInterval(updateClock, 1000);
        };
    </script>
</body>
</html>
